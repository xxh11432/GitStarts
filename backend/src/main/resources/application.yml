server:
  port: 8080
  servlet:
    context-path: /api
    session:
      timeout: ${SESSION_TTL:7d}
      cookie:
        name: GS_SESSION
        http-only: true
        same-site: lax
        # 本地 HTTP 调试为 false；生产 HTTPS 环境务必设为 true
        secure: ${SESSION_COOKIE_SECURE:false}
        path: /
  # 信任 Nginx 透传的 X-Forwarded-Proto / X-Forwarded-For，保证 HTTPS 判定与 secure Cookie 正确
  forward-headers-strategy: framework

spring:
  application:
    name: github-stars-backend
  datasource:
    url: jdbc:mysql://localhost:3306/githubstars?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: githubstars
    password: githubstarspass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 健康检查需要快速失败，避免连接池耗尽时 /health 长时间挂起
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      host: localhost
      port: 6379
      password: redispass
      timeout: 2s
      connect-timeout: 2s
  session:
    store-type: redis
    timeout: ${SESSION_TTL:7d}
    redis:
      namespace: githubstars:session
  security:
    oauth2:
      client:
        registration:
          github:
            # 未配置时保留占位值，保证本地无 OAuth 配置也能启动
            client-id: ${AUTH_GITHUB_CLIENT_ID:not-configured}
            client-secret: ${AUTH_GITHUB_CLIENT_SECRET:not-configured}
            client-name: GitHub
            scope: read:user,user:email
            authorization-grant-type: authorization_code
            redirect-uri: ${AUTH_GITHUB_REDIRECT_URI:http://localhost/api/auth/github/callback}
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

github:
  api-base: https://api.github.com
  token: ${GITHUB_TOKEN:}
  sync-enabled: ${SYNC_ENABLED:true}
  # 分层发现：Search API 单查询最多 1000 条，总量靠多趟查询 + full_name 去重达到目标
  sync:
    max-repos: ${SYNC_MAX_REPOS:2000}
    incremental-batch: ${SYNC_INCREMENTAL_BATCH:200}
    active-days: ${SYNC_ACTIVE_DAYS:90}
    language-batch: ${SYNC_LANGUAGE_BATCH:100}
    release-refresh-daily: ${SYNC_RELEASE_REFRESH:2000}

app:
  # 部署环境：production 下启用启动期安全自检
  environment: ${ENVIRONMENT:production}
  # 登录成功后回跳的前端地址（Nginx 入口）
  frontend-url: ${APP_FRONTEND_URL:http://localhost}
  # 服务间内部接口鉴权；为空时内部接口拒绝全部请求（fail closed）
  internal-token: ${INTERNAL_TOKEN:}
  quota:
    chat-daily: ${QUOTA_CHAT_DAILY:30}
    compare-daily: ${QUOTA_COMPARE_DAILY:3}
    # 单用户日 token 成本预算（输入+输出），0 表示关闭阻断
    token-daily: ${QUOTA_TOKEN_DAILY:200000}
    # 加权计费：每 N tokens 追加消耗 1 次额度，0 表示纯按次数计
    tokens-per-unit: ${QUOTA_TOKENS_PER_UNIT:8000}
    # 崩溃遗留 reserved 的回收阈值；compare 要大于 1 小时 checkpoint TTL
    reaper-timeout-minutes: ${QUOTA_REAPER_TIMEOUT_MINUTES:15}
    reaper-compare-timeout-minutes: ${QUOTA_REAPER_COMPARE_TIMEOUT_MINUTES:120}
    ledger-retention-days: ${QUOTA_LEDGER_RETENTION_DAYS:180}
  ops:
    # 成本看板可读用户（GitHub login，逗号分隔）；为空时默认全部拒绝
    logins: ${OPS_GITHUB_LOGINS:}
    daily-token-budget: ${OPS_DAILY_TOKEN_BUDGET:2000000}
    daily-compare-budget: ${OPS_DAILY_COMPARE_BUDGET:200}
    p95-chat-ms: ${OPS_P95_CHAT_MS:30000}
    p95-match-ms: ${OPS_P95_MATCH_MS:30000}
    p95-compare-ms: ${OPS_P95_COMPARE_MS:180000}
    # ai_metrics 保留天数；0 表示不自动清理
    retention-days: ${OPS_METRICS_RETENTION_DAYS:180}

logging:
  level:
    com.githubstars: info
  pattern:
    # 在日志级别后输出请求 ID，与 Nginx / llm-service 的 X-Request-Id 对齐
    level: "%5p [%X{requestId:-}]"
