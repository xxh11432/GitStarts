services:
  mysql:
    image: mysql:8.0
    container_name: gs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: gs-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: gs-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6333"
      - "6334"

  backend:
    build: ./backend
    container_name: gs-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SYNC_ENABLED: ${SYNC_ENABLED}
      # 账号 / 会话 / 配额（M1）
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-not-configured}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-not-configured}
      AUTH_GITHUB_REDIRECT_URI: ${AUTH_GITHUB_REDIRECT_URI:-http://localhost/api/auth/github/callback}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-7d}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      QUOTA_CHAT_DAILY: ${QUOTA_CHAT_DAILY:-30}
      QUOTA_COMPARE_DAILY: ${QUOTA_COMPARE_DAILY:-3}
      TZ: Asia/Shanghai
    expose:
      - "8080"

  llm-service:
    build:
      context: ./llm-service
      args:
        PREWARM_MODELS: ${PREWARM_MODELS:-true}
    container_name: gs-llm-service
    restart: unless-stopped
    depends_on:
      - qdrant
      - backend
      - redis
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-ai/DeepSeek-V3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1024}
      FASTEMBED_CACHE: /models
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
      CHECKPOINT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      COMPARE_CONCURRENCY: ${COMPARE_CONCURRENCY:-4}
      QUOTA_CHAT_DAILY: ${QUOTA_CHAT_DAILY:-30}
      QUOTA_COMPARE_DAILY: ${QUOTA_COMPARE_DAILY:-3}
      WORKER_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - model-cache:/models
    expose:
      - "8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/ai/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ingest-worker:
    build:
      context: ./llm-service
      args:
        PREWARM_MODELS: ${PREWARM_MODELS:-true}
    container_name: gs-ingest-worker
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    depends_on:
      - qdrant
      - redis
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-ai/DeepSeek-V3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1024}
      FASTEMBED_CACHE: /models
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
      CHECKPOINT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      TZ: Asia/Shanghai
    volumes:
      - model-cache:/models

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080}
    container_name: gs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080}
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: gs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - llm-service

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  model-cache:
