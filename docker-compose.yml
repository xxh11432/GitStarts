x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    container_name: gs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    # 2 GB 档：关闭 performance_schema、缩小 buffer pool 与临时表，常驻约 250 MB
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-64M}
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --max-connections=50
      - --table-open-cache=64
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --thread-cache-size=8
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${MYSQL_MEM_LIMIT:-224m}
    logging: *default-logging

  redis:
    image: redis:7
    container_name: gs-redis
    restart: unless-stopped
    # AOF 保证配额计数与对比 checkpoint 在重启后不丢失；volatile-lru 只淘汰带 TTL 的缓存键
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: gs-qdrant
    restart: unless-stopped
    environment:
      # 低内存档：payload 与向量/HNSW 落盘（mmap），避免索引常驻内存
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    mem_limit: ${QDRANT_MEM_LIMIT:-160m}
    logging: *default-logging

  backend:
    build: ./backend
    container_name: gs-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SYNC_ENABLED: ${SYNC_ENABLED}
      # 分层发现配额：GitHub Search 单查询上限 1000 条，总量靠多趟查询去重达成
      SYNC_MAX_REPOS: ${SYNC_MAX_REPOS:-2000}
      SYNC_INCREMENTAL_BATCH: ${SYNC_INCREMENTAL_BATCH:-200}
      SYNC_ACTIVE_DAYS: ${SYNC_ACTIVE_DAYS:-90}
      SYNC_LANGUAGE_BATCH: ${SYNC_LANGUAGE_BATCH:-100}
      SYNC_RELEASE_REFRESH: ${SYNC_RELEASE_REFRESH:-2000}
      # 部署环境：https 站点会触发启动期安全自检（Cookie Secure、示例口令等）
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # 账号 / 会话 / 配额（M1）
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-not-configured}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-not-configured}
      AUTH_GITHUB_REDIRECT_URI: ${AUTH_GITHUB_REDIRECT_URI:-http://localhost/api/auth/github/callback}
      # 生产默认 true；本地 HTTP 调试需在 .env 显式设为 false
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TTL: ${SESSION_TTL:-7d}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      QUOTA_CHAT_DAILY: ${QUOTA_CHAT_DAILY:-30}
      QUOTA_COMPARE_DAILY: ${QUOTA_COMPARE_DAILY:-3}
      # 成本看板（M7）：可读账号、预算阈值与指标保留期
      OPS_GITHUB_LOGINS: ${OPS_GITHUB_LOGINS:-}
      OPS_DAILY_TOKEN_BUDGET: ${OPS_DAILY_TOKEN_BUDGET:-2000000}
      OPS_DAILY_COMPARE_BUDGET: ${OPS_DAILY_COMPARE_BUDGET:-200}
      OPS_P95_CHAT_MS: ${OPS_P95_CHAT_MS:-30000}
      OPS_P95_MATCH_MS: ${OPS_P95_MATCH_MS:-30000}
      OPS_P95_COMPARE_MS: ${OPS_P95_COMPARE_MS:-180000}
      OPS_METRICS_RETENTION_DAYS: ${OPS_METRICS_RETENTION_DAYS:-180}
      # 2 GB 档 JVM：限制堆/元空间/直接内存，SerialGC 降低 native 开销
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=112m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      TZ: Asia/Shanghai
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: ${BACKEND_MEM_LIMIT:-448m}
    logging: *default-logging

  llm-service:
    image: gitstars-llm-service:local
    build:
      context: ./llm-service
      args:
        PREWARM_MODELS: ${PREWARM_MODELS:-false}
        LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-BAAI/bge-m3}
    container_name: gs-llm-service
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      qdrant:
        condition: service_started
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.himodels.ai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-v4-flash}
      LLM_THINKING_MODE: ${LLM_THINKING_MODE:-disabled}
      # embedding 走独立供应商（默认硅基流动 bge-m3），不加载本地模型
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-api}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      FASTEMBED_CACHE: /models
      MALLOC_ARENA_MAX: "2"
      BACKEND_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-repo_chunks}
      QDRANT_ON_DISK: ${QDRANT_ON_DISK:-true}
      CHECKPOINT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      COMPARE_CONCURRENCY: ${COMPARE_CONCURRENCY:-4}
      QUOTA_CHAT_DAILY: ${QUOTA_CHAT_DAILY:-30}
      QUOTA_COMPARE_DAILY: ${QUOTA_COMPARE_DAILY:-3}
      MATCH_RECALL_LIMIT: ${MATCH_RECALL_LIMIT:-40}
      MATCH_RERANK_LIMIT: ${MATCH_RERANK_LIMIT:-8}
      MATCH_CACHE_TTL_SECONDS: ${MATCH_CACHE_TTL_SECONDS:-600}
      COMPARE_EVIDENCE_TOPK: ${COMPARE_EVIDENCE_TOPK:-6}
      COMPARE_CACHE_TTL_SECONDS: ${COMPARE_CACHE_TTL_SECONDS:-604800}
      COMPARE_CHECKPOINT_TTL_SECONDS: ${COMPARE_CHECKPOINT_TTL_SECONDS:-3600}
      COMPARE_TIMEOUT_SECONDS: ${COMPARE_TIMEOUT_SECONDS:-240}
      # worker 专用参数，两处同步以保持同一镜像配置一致
      GITHUB_REQUESTS_PER_MINUTE: ${GITHUB_REQUESTS_PER_MINUTE:-60}
      WORKER_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - model-cache:/models
    expose:
      - "8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/ai/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${LLM_MEM_LIMIT:-256m}
    stop_grace_period: 30s
    logging: *default-logging

  ingest-worker:
    # 与 llm-service 复用同一镜像，避免重复构建与重复预热 embedding 模型
    image: gitstars-llm-service:local
    container_name: gs-ingest-worker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "worker"]
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.himodels.ai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-v4-flash}
      LLM_THINKING_MODE: ${LLM_THINKING_MODE:-disabled}
      # 与 llm-service 保持一致：embedding 走 API，worker 不加载本地模型
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-api}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      FASTEMBED_CACHE: /models
      MALLOC_ARENA_MAX: "2"
      BACKEND_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-repo_chunks}
      QDRANT_ON_DISK: ${QDRANT_ON_DISK:-true}
      CHECKPOINT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      GITHUB_ALLOWED_HOSTS: ${GITHUB_ALLOWED_HOSTS:-api.github.com}
      # 与 backend 共享同一 GitHub Token 配额：worker 限速留出余量给采集
      GITHUB_REQUESTS_PER_MINUTE: ${GITHUB_REQUESTS_PER_MINUTE:-60}
      INDEX_INTERVAL_MINUTES: ${INDEX_INTERVAL_MINUTES:-60}
      INDEX_ON_STARTUP: ${INDEX_ON_STARTUP:-true}
      INDEX_FULL_REBUILD: ${INDEX_FULL_REBUILD:-false}
      INDEX_MAX_REPOS: ${INDEX_MAX_REPOS:-0}
      INDEX_PAGE_SIZE: ${INDEX_PAGE_SIZE:-100}
      INDEX_MANIFESTS_ENABLED: ${INDEX_MANIFESTS_ENABLED:-true}
      TZ: Asia/Shanghai
    volumes:
      - model-cache:/models
    mem_limit: ${WORKER_MEM_LIMIT:-192m}
    logging: *default-logging

  alert-worker:
    # 异常日志通知：通过 Docker API 巡检容器状态与 ERROR 日志，推送飞书卡片
    image: python:3.12-slim
    container_name: gs-alert-worker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      ALERT_ENABLED: ${ALERT_ENABLED:-true}
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      ALERT_SECRET: ${ALERT_SECRET:-}
      ALERT_ENV: ${ALERT_ENV:-production}
      ALERT_INTERVAL_SECONDS: ${ALERT_INTERVAL_SECONDS:-60}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/alerting/alertd.py:/app/alertd.py:ro
      - alert-state:/var/lib/gitstars-alert
    command: ["python", "/app/alertd.py", "--loop"]
    mem_limit: ${ALERT_MEM_LIMIT:-32m}
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080}
    container_name: gs-frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080}
      NEXT_TELEMETRY_DISABLED: "1"
      # 限制 Node 老年代；SSR 页面单次输出可达 200+ KB，并发渲染实测需 ~300 MB，
      # 128m 会在约 20 并发时堆溢出（FATAL ERROR: heap out of memory）并导致 502
      NODE_OPTIONS: "--max-old-space-size=320"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: gs-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${NGINX_MEM_LIMIT:-32m}
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  model-cache:
  alert-state:
