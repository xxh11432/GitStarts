worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream llm_service {
        server llm-service:8081;
    }

    server {
        listen 80;
        server_name _;

        # 基础安全响应头（各 location 未单独声明 add_header 时继承）
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # 未使用 next/image：直接关闭图片优化器，缩小攻击面
        location = /_next/image {
            return 404;
        }

        # 构建产物带内容哈希，可长期缓存
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            expires 1y;
            access_log off;
        }

        # 服务间接口绝不对外暴露
        location /api/internal/ {
            return 404;
        }

        # 会话校验：仅供 auth_request 子请求使用，外部访问返回 404
        location = /api/internal/auth/session {
            internal;
            proxy_pass http://backend;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
        }

        # AI 网关健康检查保持匿名
        location = /ai/health {
            proxy_pass http://llm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }

        # AI 网关：未登录返回 401；SSE 必须关闭缓冲与压缩
        location /ai/ {
            auth_request /api/internal/auth/session;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            error_page 401 = @ai_unauthorized;

            proxy_pass http://llm_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header X-Accel-Buffering no;
        }

        location @ai_unauthorized {
            default_type application/json;
            return 401 '{"code":"unauthorized","message":"请先登录"}';
        }

        # 前端
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}
