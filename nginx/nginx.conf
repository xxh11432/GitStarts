worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # 按来源 IP 限流：防止公开接口被刷、避免 README 抓取打满 GitHub 配额
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=readme_zone:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # 请求体上限：对话 / 对比正文远小于该值
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream llm_service {
        server llm-service:8081;
    }

    # HTTP 只做跳转，正式流量全部走 443
    server {
        listen 80;
        server_name _;
        return 301 https://www.gitstars.cn$request_uri;
    }

    # HTTPS 入口：证书由 /etc/letsencrypt 只读挂载（见 docker-compose.yml）
    server {
        listen 443 ssl;
        http2 on;
        server_name www.gitstars.cn gitstars.cn;

        ssl_certificate     /etc/letsencrypt/live/www.gitstars.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.gitstars.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        limit_conn per_ip 50;

        # 基础安全响应头（各 location 未单独声明 add_header 时继承）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # 未使用 next/image：直接关闭图片优化器，缩小攻击面
        location = /_next/image {
            return 404;
        }

        # 构建产物带内容哈希，可长期缓存
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            expires 1y;
            access_log off;
        }

        # 服务间接口绝不对外暴露
        location /api/internal/ {
            return 404;
        }

        # 会话校验：仅供 auth_request 子请求使用，外部访问返回 404
        location = /api/internal/auth/session {
            internal;
            proxy_pass http://backend;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # GitHub 登录入口：限制单 IP 发起频率，避免刷 OAuth 回调
        location = /api/auth/github/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # README 摘要会实时调用 GitHub，单独收紧到 1r/s，避免打满 Token 配额
        location ~ ^/api/repos/[^/]+/[^/]+/readme$ {
            limit_req zone=readme_zone burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # 后端 API
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # AI 网关健康检查保持匿名
        location = /ai/health {
            proxy_pass http://llm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }

        # AI 网关：未登录返回 401；SSE 必须关闭缓冲与压缩
        location /ai/ {
            limit_req zone=ai_zone burst=6 nodelay;
            auth_request /api/internal/auth/session;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            error_page 401 = @ai_unauthorized;

            proxy_pass http://llm_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header X-Accel-Buffering no;
        }

        location @ai_unauthorized {
            default_type application/json;
            return 401 '{"code":"unauthorized","message":"请先登录"}';
        }

        # 前端
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}
